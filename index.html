<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Health Monitoring System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,sans-serif;
}

body{

background:#050505;

color:white;

overflow-x:hidden;

background-image:

linear-gradient(rgba(0,255,120,.05) 1px,transparent 1px),

linear-gradient(90deg,rgba(0,255,120,.05) 1px,transparent 1px);

background-size:45px 45px;

}

/**************** HEADER ****************/

header{

background:#111;

padding:25px;

border-bottom:3px solid #00ff88;

box-shadow:0 0 20px #00ff88;

text-align:center;

}

header h1{

font-size:46px;

letter-spacing:2px;

color:#00ff88;

}

header p{

margin-top:10px;

font-size:26px;

}

.status{

margin-top:18px;

font-size:24px;

display:flex;

justify-content:center;

align-items:center;

gap:15px;

}

.dot{

width:18px;

height:18px;

border-radius:50%;

background:#00ff00;

animation:blink 1s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

/**************** ECG ****************/

.ecg{

margin:30px auto;

width:90%;

height:140px;

background:black;

border:2px solid #00ff88;

border-radius:18px;

overflow:hidden;

position:relative;

}

.ecg svg{

width:200%;

height:140px;

position:absolute;

animation:move 5s linear infinite;

}

@keyframes move{

from{

transform:translateX(0);

}

to{

transform:translateX(-50%);

}

}

/**************** CARDS ****************/

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

padding:35px;

}

.card{

background:#111;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:0 0 20px rgba(0,255,120,.25);

transition:.3s;

}

.card:hover{

transform:translateY(-8px);

box-shadow:0 0 30px #00ff88;

}

.card h2{

font-size:36px;

margin-bottom:25px;

color:#00ff88;

}

.value{

font-size:46px;

font-weight:bold;

transition:.4s;

}

/**************** HISTORY ****************/

.history{

width:95%;

margin:auto;

background:#111;

padding:20px;

border-radius:18px;

margin-bottom:40px;

}

.history h2{

text-align:center;

margin-bottom:20px;

font-size:36px;

color:#00ff88;

}

table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

th{

background:#00994d;

padding:15px;

}

td{

padding:15px;

text-align:center;

border-bottom:1px solid #333;

}

tr:hover{

background:#1d1d1d;

}

details{

margin-top:15px;

}

summary{

cursor:pointer;

font-size:22px;

padding:10px;

color:#00ff88;

font-weight:bold;

}

</style>

</head>

<body>

<header>

<h1>🏥 PATIENT HEALTH MONITORING SYSTEM</h1>

<p>Sarhad University of Science & Information Technology</p>

<div class="status">

<div class="dot"></div>

<div id="status">ONLINE</div>

</div>

</header>
<!-- ================= ECG MONITOR ================= -->

<div class="ecg">

<svg viewBox="0 0 1200 140">

<polyline

fill="none"

stroke="#00ff66"

stroke-width="4"

points="

0,70

80,70

120,70

160,70

180,25

205,120

230,70

330,70

430,70

450,25

475,120

500,70

600,70

700,70

720,25

745,120

770,70

900,70

980,70

1000,25

1025,120

1050,70

1200,70

"/>

</svg>

</div>

<!-- ================= LIVE DATA CARDS ================= -->

<div class="cards">

<div class="card">

<h2>❤️ Heart Rate</h2>

<div class="value" id="hr">

--

</div>

</div>

<div class="card">

<h2>🌡 Temperature</h2>

<div class="value" id="temp">

--

</div>

</div>

<div class="card">

<h2>🫁 SpO₂</h2>

<div class="value" id="spo2">

--

</div>

</div>

<div class="card">

<h2>🕒 Time</h2>

<div class="value" id="time">

--

</div>

</div>

</div>

<!-- ================= HISTORY ================= -->

<div class="history">

<h2>📊 Patient History</h2>

<div id="historyBox">

Loading patient history...

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey:"AIzaSyC9eQNZPtqWXfjy85v6Bfnpm77t648ih8",
authDomain:"real-time-patient-monito-76d69.firebaseapp.com",
databaseURL:"https://real-time-patient-monito-76d69-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"real-time-patient-monito-76d69",
storageBucket:"real-time-patient-monito-76d69.appspot.com",
messagingSenderId:"807607602018",
appId:"1:807607602018:web:5110875164e2873bb77a3b"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

//===================== LIVE DATA =====================

const liveRef = ref(db,"Live");

onValue(liveRef,(snapshot)=>{

const data = snapshot.val();

if(data==null){

document.getElementById("status").innerHTML="OFFLINE";

document.getElementById("status").style.color="red";

return;

}

document.getElementById("status").innerHTML=data.WiFi ?? "ONLINE";

document.getElementById("status").style.color=
(data.WiFi=="ONLINE") ? "#00ff00" : "red";

document.getElementById("temp").innerHTML=
(data.Temperature ?? "--")+" °C";

document.getElementById("hr").innerHTML=
(data.HeartRate ?? "--")+" BPM";

document.getElementById("spo2").innerHTML=
(data.SpO2 ?? "--")+" %";

document.getElementById("time").innerHTML=
(data.Time ?? "--");

// Temperature Alert

if(Number(data.Temperature)>=38){

document.getElementById("temp").style.color="red";

}else{

document.getElementById("temp").style.color="#00ff88";

}

// Heart Rate Alert

if(Number(data.HeartRate)>100 || Number(data.HeartRate)<50){

document.getElementById("hr").style.color="red";

}else{

document.getElementById("hr").style.color="#00ff88";

}

// SpO₂ Alert

if(Number(data.SpO2)<95){

document.getElementById("spo2").style.color="red";

}else{

document.getElementById("spo2").style.color="#00ff88";

}

});
//===================== HISTORY =====================

const historyRef = ref(db,"History");

onValue(historyRef,(snapshot)=>{

const history = snapshot.val();

const historyBox = document.getElementById("historyBox");

if(!history){

historyBox.innerHTML="<h3>No History Available</h3>";

return;

}

let html="";

Object.keys(history).reverse().forEach(date=>{

html+=`

<details>

<summary>📅 ${date}</summary>

<table>

<tr>

<th>Time</th>

<th>Temperature</th>

<th>Heart Rate</th>

<th>SpO₂</th>

</tr>

`;

const dayData = history[date];

Object.keys(dayData).reverse().forEach(time=>{

const row = dayData[time];

html+=`

<tr>

<td>${row.Time ?? time}</td>

<td>${row.Temperature ?? "--"} °C</td>

<td>${row.HeartRate ?? "--"} BPM</td>

<td>${row.SpO2 ?? "--"} %</td>

</tr>

`;

});

html+=`

</table>

</details>

`;

});

historyBox.innerHTML=html;

},(error)=>{

console.error(error);

document.getElementById("historyBox").innerHTML="Unable to load history.";

});

</script>
</body>
</html>
