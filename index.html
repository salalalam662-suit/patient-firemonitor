<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Monitor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:#050505;
color:#fff;
overflow-x:hidden;

background-image:
linear-gradient(rgba(0,255,120,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,120,.05) 1px,transparent 1px);

background-size:40px 40px;

}

/******** HEADER ********/

header{

background:#0d0d0d;
padding:20px;
border-bottom:3px solid #00ff88;
box-shadow:0 0 20px #00ff88;

}

header h1{

text-align:center;
font-size:38px;
letter-spacing:3px;
color:#00ff88;

}

header h3{

text-align:center;
font-weight:400;
margin-top:8px;
color:white;

}

/******** STATUS ********/

.status{

display:flex;
justify-content:center;
align-items:center;
gap:12px;

margin-top:15px;

font-size:22px;

}

.dot{

width:18px;
height:18px;
background:#00ff00;
border-radius:50%;

animation:blink 1s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

/******** ECG ********/

.ecg{

margin:30px auto;

width:90%;
height:120px;

border:2px solid #00ff88;

border-radius:15px;

overflow:hidden;

background:black;

position:relative;

}

svg{

width:200%;
height:120px;

position:absolute;

animation:move 5s linear infinite;

}

@keyframes move{

from{

transform:translateX(0);

}

to{

transform:translateX(-50%);

}

}

/******** CARDS ********/

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

}

.card{

background:#111;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 0 20px rgba(0,255,120,.3);

transition:.3s;

}

.card:hover{

transform:scale(1.05);

box-shadow:0 0 35px #00ff88;

}

.card h2{

margin-bottom:15px;

color:#00ff88;

}

.value{

font-size:38px;

font-weight:bold;

}

/******** HISTORY ********/

.history{

width:95%;

margin:auto;

background:#111;

padding:20px;

border-radius:15px;

margin-bottom:30px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#00aa55;

padding:15px;

}

td{

padding:15px;

text-align:center;

border-bottom:1px solid #333;

}

tr:hover{

background:#1a1a1a;

}

</style>
</head>

<body>

<header>

<h1>🏥 PATIENT HEALTH MONITORING SYSTEM</h1>

<h3>Sarhad University of Science & Information Technology</h3>

<div class="status">

<div class="dot"></div>

<div id="status">

ONLINE

</div>

</div>

</header>

<!-- ECG Animation -->

<div class="ecg">

<svg viewBox="0 0 1200 120">

<polyline

fill="none"

stroke="#00ff66"

stroke-width="3"

points="

0,60

80,60

100,60

120,60

140,20

160,100

180,60

260,60

340,60

360,20

380,100

400,60

480,60

560,60

580,20

600,100

620,60

700,60

780,60

800,20

820,100

840,60

920,60

1000,60

1020,20

1040,100

1060,60

1200,60

"/>

</svg>

</div>

<div class="cards">

<div class="card">

<h2>❤️ Heart Rate</h2>

<div class="value" id="hr">

--

</div>

</div>

<div class="card">

<h2>🌡 Temperature</h2>

<div class="value" id="temp">

--

</div>

</div>

<div class="card">

<h2>🫁 SpO₂</h2>

<div class="value" id="spo2">

--

</div>

</div>

<div class="card">

<h2>🕒 Time</h2>

<div class="value" id="time">

--

</div>

</div>

</div>

<div class="history">

<h2 align="center">

📊 Patient History

</h2>

<div id="historyBox">

Loading...

</div>

</div>

</body>
</html>
