<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Monitor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:#050505;
color:#fff;
overflow-x:hidden;

background-image:
linear-gradient(rgba(0,255,120,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,120,.05) 1px,transparent 1px);

background-size:40px 40px;

}

/******** HEADER ********/

header{

background:#0d0d0d;
padding:20px;
border-bottom:3px solid #00ff88;
box-shadow:0 0 20px #00ff88;

}

header h1{

text-align:center;
font-size:38px;
letter-spacing:3px;
color:#00ff88;

}

header h3{

text-align:center;
font-weight:400;
margin-top:8px;
color:white;

}

/******** STATUS ********/

.status{

display:flex;
justify-content:center;
align-items:center;
gap:12px;

margin-top:15px;

font-size:22px;

}

.dot{

width:18px;
height:18px;
background:#00ff00;
border-radius:50%;

animation:blink 1s infinite;

}

@keyframes blink{

50%{

opacity:.2;

}

}

/******** ECG ********/

.ecg{

margin:30px auto;

width:90%;
height:120px;

border:2px solid #00ff88;

border-radius:15px;

overflow:hidden;

background:black;

position:relative;

}

svg{

width:200%;
height:120px;

position:absolute;

animation:move 5s linear infinite;

}

@keyframes move{

from{

transform:translateX(0);

}

to{

transform:translateX(-50%);

}

}

/******** CARDS ********/

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

padding:30px;

}

.card{

background:#111;

border-radius:20px;

padding:25px;

text-align:center;

box-shadow:0 0 20px rgba(0,255,120,.3);

transition:.3s;

}

.card:hover{

transform:scale(1.05);

box-shadow:0 0 35px #00ff88;

}

.card h2{

margin-bottom:15px;

color:#00ff88;

}

.value{

font-size:38px;

font-weight:bold;

}

/******** HISTORY ********/

.history{

width:95%;

margin:auto;

background:#111;

padding:20px;

border-radius:15px;

margin-bottom:30px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

th{

background:#00aa55;

padding:15px;

}

td{

padding:15px;

text-align:center;

border-bottom:1px solid #333;

}

tr:hover{

background:#1a1a1a;

}
/* Pulse animation */

@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.08); }
100% { transform: scale(1); }
}

.card:hover .value{
animation:pulse .6s infinite;
}

/* Fade effect */

.value{
transition:all .4s ease;
}

/* Smooth history */

details{
margin-top:15px;
background:#181818;
border-radius:10px;
padding:10px;
}

summary{
cursor:pointer;
font-size:20px;
color:#00ff88;
padding:10px;
font-weight:bold;
}

summary:hover{
color:white;
}
</style>
</head>

<body>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyC9eQNZPtqWXfjy85v6Bfnpm77t648ih8",
  authDomain:"real-time-patient-monito-76d69.firebaseapp.com",
  databaseURL:"https://real-time-patient-monito-76d69-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"real-time-patient-monito-76d69",
  storageBucket:"real-time-patient-monito-76d69.firebasestorage.app",
  messagingSenderId:"807607602018",
  appId:"1:807607602018:web:5110875164e2873bb77a3b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ==================== LIVE DATA ====================

onValue(ref(db,"Live"),(snapshot)=>{

const d = snapshot.val();

if(!d){
document.getElementById("status").innerHTML="OFFLINE";
document.getElementById("status").style.color="red";
return;
}

document.getElementById("temp").innerHTML=d.Temperature+" °C";
document.getElementById("hr").innerHTML=d.HeartRate+" BPM";
document.getElementById("spo2").innerHTML=d.SpO2+" %";
document.getElementById("time").innerHTML=d.Time;

const status=document.getElementById("status");
status.innerHTML=d.WiFi;

document.getElementById("temp").style.color=
d.Temperature>=38?"red":"#00ff88";

document.getElementById("hr").style.color=
(d.HeartRate>100||d.HeartRate<50)?"red":"#00ff88";

document.getElementById("spo2").style.color=
d.SpO2<95?"red":"#00ff88";

status.style.color=
d.WiFi=="ONLINE"?"#00ff00":"red";

});

// ==================== HISTORY ====================

onValue(ref(db,"History"),(snapshot)=>{

const history=snapshot.val();

if(!history){
document.getElementById("historyBox").innerHTML="No History";
return;
}

let html="";

for(const date in history){

html+=`
<details open>

<summary>📅 ${date}</summary>

<table>

<tr>

<th>Time</th>

<th>Temperature</th>

<th>Heart Rate</th>

<th>SpO₂</th>

</tr>
`;

for(const tm in history[date]){

const r=history[date][tm];

html+=`

<tr>

<td>${r.Time}</td>

<td>${r.Temperature}</td>

<td>${r.HeartRate}</td>

<td>${r.SpO2}</td>

</tr>

`;

}

html+=`

</table>

</details>

`;

}

document.getElementById("historyBox").innerHTML=html;

});

</script>
